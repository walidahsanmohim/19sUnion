  <style>
    /* global  */
    html, body {
      margin: 0;
      padding: 10px;
      background: transparent !important;
      overflow-x: hidden !important; 
      overflow-y: hidden !important; 
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* grid card */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      width: 100%;
    }

    /* card design */
    .member-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-clip: padding-box;
    }

    .member-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    /* image details */
    .member-img-box {
      width: 240px;        
      height: 240px;       
      border-radius: 50%;
      border: 4px solid #0284c7; 
      overflow: hidden;
      margin-bottom: 15px;
      margin-top: 5px;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15); 
    }

    .member-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* default icon img */
    .member-img-box i {
      font-size: 45px;
      color: #94a3b8;
    }

    /* Identity */
    .member-name {
      font-size: 20px;
      font-weight: 700;
      color: #004369;
      margin-bottom: 4px;
    }

    .member_id {
      font-size: 14px;
      background: rgba(2, 132, 199, 0.12);
      color: #006091;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* primery info  */
    .primary-info {
      width: 100%;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      padding-top: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      text-align: left;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #002122;      
      margin-bottom: 6px;
    }

    .info-item i {
      color: #00575a;
      width: 16px;
    }

    /* ৬. button drop-down */
    .view-profile-btn {
      width: 100%;
      background: #f1f5f9;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #003f31b2;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: background 1.2s;
    }

    .view-profile-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    /* hidden profile */
    .full-details {
      max-height: 0;
      overflow: hidden;
      width: 100%;
      text-align: left;
      font-size: 12.5px;
      transition: max-height 0.11s ease-out;
    }

    /* buttn click */
    .full-details.open {
      max-height: 300px; 
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      margin-top: 10px;
      padding-top: 10px;
    }

    .detail-row {
      display: flex;
      margin-bottom: 6px;
    }

    .detail-label {
      color: #64748b;
      font-weight: 600;
      width: 90px;
      flex-shrink: 0;
    }

    .detail-value {
      color: #1e293b;
      font-weight: 500;
    }
    /* 8. animation for card fade-in */
    .member-card {
      animation: cardFadeIn 1.5s ease-out both;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 650px) {
  html, body {
    overflow-y: hidden !important;
  }
  .member-grid {
    grid-template-columns: 1fr; 
    gap: 12px;
  }
  .member-card { 
    padding: 12px; 
    width: 100%; 
  }
  .member-img-box {
    width: 170px;        
    height: 170px;       
  }
  .detail-value {
    word-break: break-word; 
  }
}

    membersData.forEach((member, index) => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.style.animationDelay = `${index * 0.05}s`;

      const imgContent = directPhotoUrl ? `<img src="${directPhotoUrl}" alt="${member.name}">` : `<i class="fa-solid fa-user"></i>`;

        <div class="member-img-box">${imgContent}</div>
        <div class="member-name">${member.name}</div>
        <div class="member_id">ID: ${member.member_id}</div>

    function toggleProfile(button) {
      const details = button.nextElementSibling;
      const icon = button.querySelector('.fa-chevron-down, .fa-chevron-up');
      
      details.classList.toggle('open');
      
      if (details.classList.contains('open')) {
        button.querySelector('span').innerText = "Hide Profile";
        icon.className = "fa-solid fa-chevron-up";
      } else {
        button.querySelector('span').innerText = "View Full Profile";
        icon.className = "fa-solid fa-chevron-down";
      }
    }
