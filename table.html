<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock & Dual Calendar</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Custom Properties for Design System */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.5);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-accent: #38bdf8;
      --arabic-accent: #fbbf24;
      --bangla-accent: #34d399;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Main Container with Glassmorphism Effect */
    .dashboard {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 80px rgba(56, 189, 248, 0.05);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
    }

    /* Digital Clock Display */
    .clock-section {
      text-align: center;
      position: relative;
    }

    .time-display {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.8rem, 8vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .time-period {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 500;
      color: var(--primary-accent);
      margin-left: 0.5rem;
    }

    .gregorian-date {
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      width: 100%;
    }

    /* Calendar Grid for Hijri & Bangla Cards */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .calendar-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .calendar-card:hover {
      transform: translateY(-3px);
    }

    .calendar-card.arabic {
      border-top: 3px solid var(--arabic-accent);
    }

    .calendar-card.bangla {
      border-top: 3px solid var(--bangla-accent);
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .arabic .card-label { color: var(--arabic-accent); }
    .bangla .card-label { color: var(--bangla-accent); }

    .date-display {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    /* English Transliterated Hijri Typography */
    .arabic .hijri-english {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--arabic-accent);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    /* Native Arabic Script Typography */
    .arabic .hijri-arabic {
      font-family: 'Amiri', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      direction: rtl;
      line-height: 1.2;
    }

    .arabic .day-name {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    /* Bangla Typography Settings */
    .bangla .main-date {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .bangla .day-name {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    /* Mobile Adaptations */
    @media (max-width: 480px) {
      .dashboard {
        padding: 1.75rem 1.25rem;
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="dashboard">
    <!-- Clock Section -->
    <section class="clock-section">
      <div class="time-display" id="clock">
        00:00:00<span class="time-period" id="ampm">AM</span>
      </div>
      <div class="gregorian-date" id="gregorian-date">Loading date...</div>
    </section>

    <div class="divider"></div>

    <!-- Dual Calendar Section -->
    <section class="calendar-grid">
      
      <!-- Arabic / Hijri Calendar Card -->
      <article class="calendar-card arabic">
        <div class="card-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          Hijri / Islamic Date
        </div>
        <div class="date-display">
          <!-- Transliterated English Hijri Date (e.g. 23 Safar 1448 AH) -->
          <div class="hijri-english" id="hijri-english">...</div>
          <!-- Native Arabic Script -->
          <div class="hijri-arabic" id="hijri-arabic">...</div>
          <div class="day-name" id="arabic-day">...</div>
        </div>
      </article>

      <!-- Bangla Calendar Card -->
      <article class="calendar-card bangla">
        <div class="card-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          Bangla Calendar
        </div>
        <div class="date-display">
          <div class="main-date" id="bangla-date">...</div>
          <div class="day-name" id="bangla-day">...</div>
        </div>
      </article>

    </section>
  </main>

  <script>
    // Transliterated Islamic Month Names in English
    const hijriMonthsEnglish = [
      "Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani",
      "Jumada al-Awwal", "Jumada al-Thani", "Rajab", "Sha'ban",
      "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"
    ];

    // Transliterated Islamic Day Names in English
    const hijriDaysEnglish = [
      "Al-Ahad", "Al-Ithnayn", "Ath-Thulatha", "Al-Arbi'a", "Al-Khamis", "Al-Jumu'ah", "As-Sabt"
    ];

    // Bangla Digit Conversion Utility
    const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    function toBanglaNumerals(num) {
      return num.toString().replace(/\d/g, digit => banglaDigits[parseInt(digit)]);
    }

    // Bangla Calendar Calculation Algorithm
    function getBanglaDate(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();

      const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

      const banglaMonths = [
        "বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", 
        "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", 
        "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"
      ];

      let bYear = month < 3 || (month === 3 && day < 14) ? year - 594 : year - 593;
      let bMonth, bDay;

      if (month === 3) {
        if (day >= 14) { bMonth = 0; bDay = day - 13; }
        else { bMonth = 11; bDay = day + 17; }
      } else if (month === 4) {
        if (day >= 15) { bMonth = 1; bDay = day - 14; }
        else { bMonth = 0; bDay = day + 17; }
      } else if (month === 5) {
        if (day >= 15) { bMonth = 2; bDay = day - 14; }
        else { bMonth = 1; bDay = day + 17; }
      } else if (month === 6) {
        if (day >= 16) { bMonth = 3; bDay = day - 15; }
        else { bMonth = 2; bDay = day + 16; }
      } else if (month === 7) {
        if (day >= 17) { bMonth = 4; bDay = day - 16; }
        else { bMonth = 3; bDay = day + 15; }
      } else if (month === 8) {
        if (day >= 17) { bMonth = 5; bDay = day - 16; }
        else { bMonth = 4; bDay = day + 15; }
      } else if (month === 9) {
        if (day >= 18) { bMonth = 6; bDay = day - 17; }
        else { bMonth = 5; bDay = day + 15; }
      } else if (month === 10) {
        if (day >= 17) { bMonth = 7; bDay = day - 16; }
        else { bMonth = 6; bDay = day + 14; }
      } else if (month === 11) {
        if (day >= 16) { bMonth = 8; bDay = day - 15; }
        else { bMonth = 7; bDay = day + 15; }
      } else if (month === 0) {
        if (day >= 15) { bMonth = 9; bDay = day - 14; }
        else { bMonth = 8; bDay = day + 16; }
      } else if (month === 1) {
        if (day >= 14) { bMonth = 10; bDay = day - 13; }
        else { bMonth = 9; bDay = day + 17; }
      } else if (month === 2) {
        const leapOffset = isLeapYear ? 1 : 0;
        if (day >= (15 - leapOffset)) { bMonth = 11; bDay = day - (14 - leapOffset); }
        else { bMonth = 10; bDay = day + 15; }
      }

      return `${toBanglaNumerals(bDay)} ${banglaMonths[bMonth]}, ${toBanglaNumerals(bYear)} বঙ্গাব্দ`;
    }

    // Real-Time Update Controller
    function updateClock() {
      const now = new Date();

      // 1. Digital Clock Time
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12;
      hours = hours ? hours : 12;
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('clock').childNodes[0].nodeValue = `${formattedHours}:${minutes}:${seconds} `;
      document.getElementById('ampm').textContent = ampm;

      // 2. Gregorian Calendar Date
      const gregOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('gregorian-date').textContent = now.toLocaleDateString('en-US', gregOptions);

      // 3. Hijri Date Logic
      try {
        // Native Arabic Formatting via Intl API
        const arDateFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        const arDayFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', { weekday: 'long' });

        // Extract numeric Hijri day, month, and year values via 'en-US-u-ca-islamic-uma'
        const parts = new Intl.DateTimeFormat('en-US-u-ca-islamic-uma', {
          day: 'numeric',
          month: 'numeric',
          year: 'numeric'
        }).formatToParts(now);

        let hDay = '', hMonthIdx = 0, hYear = '';
        parts.forEach(part => {
          if (part.type === 'day') hDay = part.value;
          if (part.type === 'month') hMonthIdx = parseInt(part.value, 10) - 1;
          if (part.type === 'year') hYear = part.value;
        });

        // Exact English Transliterated Hijri String (e.g. "23 Safar 1448 AH")
        const englishHijriFormatted = `${hDay} ${hijriMonthsEnglish[hMonthIdx]} ${hYear} AH`;
        document.getElementById('hijri-english').textContent = englishHijriFormatted;

        // Native Arabic Display
        document.getElementById('hijri-arabic').textContent = arDateFormatter.format(now);
        
        // Display English Hijri Day Name alongside Native Arabic Day Name
        const dayIdx = now.getDay();
        document.getElementById('arabic-day').innerHTML = `
          <span>${hijriDaysEnglish[dayIdx]}</span>
          <span style="font-family:'Amiri'; font-size: 1.05rem;">${arDayFormatter.format(now)}</span>
        `;
      } catch (e) {
        document.getElementById('hijri-english').textContent = "Hijri not supported";
      }

      // 4. Bangla Date Calculation
      const banglaDays = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];
      document.getElementById('bangla-date').textContent = getBanglaDate(now);
      document.getElementById('bangla-day').textContent = banglaDays[now.getDay()];
    }

    // Initialize and run interval
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
